name: notify-line

# LINE配信：土曜の朝に、直近（金曜の更新）の個人順位スクショ＋ダッシュボードURLを送る。
# スクレイピングはせず、リポジトリに保存済みの最新データ・画像を使う。
# ※ GitHub Actionsのcronは best-effort で数分〜十数分遅れることがある。
on:
  schedule:
    # JST 土 06:00 = UTC 金 21:00。金曜（5）、レギュラーシーズンの月のみ。
    - cron: "0 21 * 9-12,1-3 5"
  workflow_dispatch:      # 手動実行も可能
    inputs:
      note:
        description: "メッセージ先頭に付けるラベル（例: 🧪 テスト送信）"
        required: false
        default: ""

permissions:
  contents: write   # あおり文の使用済み記録(taunts_used.json)を保存するため

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 送信のみ。ブラウザは不要なので playwright のブラウザ導入はしない。
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send LINE (image + URL)
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_ID: ${{ secrets.LINE_TARGET_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          LINE_MESSAGE_PREFIX: ${{ inputs.note }}
        run: python -m src.notify_line

      # 使用済みあおり文の記録をコミット（シーズン中の重複防止を永続化）
      - name: Persist taunt history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: taunt history $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
