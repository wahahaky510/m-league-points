name: notify-line

# LINE配信：土曜の朝に、直近（金曜の更新）の個人順位スクショ＋ダッシュボードURLを送る。
# スクレイピングはせず、リポジトリに保存済みの最新データ・画像を使う。
on:
  schedule:
    # JST 10:00 = UTC 01:00。土曜（6）、レギュラーシーズンの月のみ。
    - cron: "0 1 * 9-12,1-3 6"
  workflow_dispatch: {}   # 手動実行も可能

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 送信のみ。ブラウザは不要なので playwright のブラウザ導入はしない。
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send LINE (image + URL)
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_ID: ${{ secrets.LINE_TARGET_ID }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: python -m src.notify_line
